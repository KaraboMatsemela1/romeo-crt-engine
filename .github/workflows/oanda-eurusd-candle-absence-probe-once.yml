name: OANDA EUR_USD Candle Absence Probe

on:
  push:
    branches:
      - agent/phase-6b-candidate-revision
    paths:
      - .github/qualification/oanda-eurusd-candle-absence-probe.request

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Require runtime-only OANDA practice credentials
        run: |
          test -n "$OANDA_ACCOUNT_ID"
          test -n "$OANDA_API_TOKEN"
      - name: Execute read-only candle-absence probe
        run: python scripts/probe_oanda_candle_absence.py
      - name: Upload credential-free probe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p6b-eurusd-candle-absence-probe
          path: artifacts/phase6b/oanda_raw/EUR_USD_CANDLE_ABSENCE_PROBE_V1.json
          if-no-files-found: error
          retention-days: 7
