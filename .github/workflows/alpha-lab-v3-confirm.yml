name: Alpha Lab V3 Confirm

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/romeo_crt_engine/alpha_lab/confirm_v3.py"
      - "tests/alpha_lab/test_confirm_v3.py"
      - ".github/workflows/alpha-lab-v3-confirm.yml"

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Verify frozen protocol and run CONFIRM once
        run: |
          python -m romeo_crt_engine.alpha_lab.confirm_v3 \
            --cache-dir .alpha-cache-v3-confirm \
            --result-out alpha-v3-confirm-result.json
      - name: Show CONFIRM result
        run: cat alpha-v3-confirm-result.json
