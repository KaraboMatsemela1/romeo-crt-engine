name: OANDA EUR_USD 2019 Raw Qualification

on:
  push:
    branches:
      - agent/phase-6b-candidate-revision
    paths:
      - .github/qualification/oanda-history-eurusd-2019.request

jobs:
  collect-eurusd-2019:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Require runtime-only OANDA practice credentials
        run: |
          test -n "$OANDA_ACCOUNT_ID"
          test -n "$OANDA_API_TOKEN"

      - name: Collect frozen EUR_USD 2019 MID M1 shard
        run: |
          python scripts/collect_oanda_history_shard.py \
            --instrument EUR_USD \
            --year 2019 \
            --output-dir /tmp/oanda_raw

      - name: Verify manifest is credential-free and outcome-locked
        run: |
          python - /tmp/oanda_raw/EUR_USD_2019_MID_M1.manifest.json <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          manifest = json.loads(path.read_text())
          serialized = json.dumps(manifest, sort_keys=True).lower()

          assert manifest['schema_version'] == 'P6B_OANDA_HISTORY_SHARD_V1'
          assert manifest['environment'] == 'practice'
          assert manifest['account_scope'] == 'REDACTED_RUNTIME_ACCOUNT'
          assert manifest['instrument'] == 'EUR_USD'
          assert manifest['year'] == 2019
          assert manifest['price_component'] == 'MID'
          assert manifest['granularity'] == 'M1'
          assert manifest['refetch']['status'] == 'EXACT_PROVIDER_VALUE_MATCH'
          assert manifest['gap_reconciliation_status'] == 'UNRECONCILED'
          assert manifest['trusted_dataset_authorized'] is False
          assert manifest['detector_execution_authorized'] is False
          assert manifest['tradeplan_count_access_authorized'] is False
          assert manifest['backtester_authorized'] is False
          assert manifest['pnl_outcome_access_authorized'] is False
          assert manifest['paper_trading_authorized'] is False
          assert manifest['shadow_trading_authorized'] is False
          assert manifest['live_trading_authorized'] is False

          for forbidden in ('account_id', 'api_token', 'authorization', 'bearer ', 'balance', 'nav'):
              assert forbidden not in serialized

          print('OANDA_HISTORY_SHARD_ARTIFACT_SAFE=true')
          print(f"page_count={manifest['page_count']}")
          print(f"complete_candle_count={manifest['complete_candle_count']}")
          print(f"missing_interval_count={manifest['missing_interval_count']}")
          print(f"missing_minutes={manifest['missing_minutes']}")
          print(f"normalized_provider_values_sha256={manifest['normalized_provider_values_sha256']}")
          print(f"retrieval_sha256={manifest['retrieval_sha256']}")
          print(f"missing_intervals_sha256={manifest['missing_intervals_sha256']}")
          print(f"refetch_provider_value_sha256={manifest['refetch']['provider_value_sha256']}")
          PY

      - name: Print credential-free raw-gap manifest
        run: cat /tmp/oanda_raw/EUR_USD_2019_MID_M1.manifest.json
