name: Alpha Lab V4 Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/romeo_crt_engine/alpha_lab/models_v4.py"
      - "src/romeo_crt_engine/alpha_lab/strategy_v4.py"
      - "src/romeo_crt_engine/alpha_lab/backtest_v4.py"
      - "src/romeo_crt_engine/alpha_lab/optimize_v4.py"
      - "src/romeo_crt_engine/alpha_lab/run_cycle_v4.py"
      - "tests/alpha_lab/test_v4.py"
      - "docs/ALPHA_LAB_V4.md"
      - ".github/workflows/alpha-lab-v4-research.yml"

jobs:
  dev-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      candidate_pass: ${{ steps.freeze.outputs.candidate_pass }}
      candidate_b64: ${{ steps.freeze.outputs.candidate_b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Search BTC DEV only
        run: |
          python -m romeo_crt_engine.alpha_lab.run_cycle_v4 dev-search \
            --cache-dir .alpha-cache-v4 \
            --candidate-out alpha-v4-candidate.json \
            --metrics-out alpha-v4-dev-metrics.json
      - name: Freeze DEV candidate
        id: freeze
        shell: bash
        run: |
          candidate_pass=$(python -c 'import json; print(str(json.load(open("alpha-v4-candidate.json"))["dev_gate_pass"]).lower())')
          echo "candidate_pass=${candidate_pass}" >> "$GITHUB_OUTPUT"
          echo "candidate_b64=$(base64 -w0 alpha-v4-candidate.json)" >> "$GITHUB_OUTPUT"
      - name: Show DEV candidate
        run: cat alpha-v4-candidate.json

  eth-holdout-a:
    needs: dev-search
    if: needs.dev-search.outputs.candidate_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      holdout_a_pass: ${{ steps.freeze.outputs.holdout_a_pass }}
      holdout_a_b64: ${{ steps.freeze.outputs.holdout_a_b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Restore exact frozen candidate
        shell: bash
        env:
          CANDIDATE_B64: ${{ needs.dev-search.outputs.candidate_b64 }}
        run: echo "$CANDIDATE_B64" | base64 -d > alpha-v4-candidate.json
      - name: Evaluate fresh ETH holdout once
        run: |
          python -m romeo_crt_engine.alpha_lab.run_cycle_v4 holdout-a \
            --cache-dir .alpha-cache-v4 \
            --candidate alpha-v4-candidate.json \
            --result-out alpha-v4-holdout-a.json
      - name: Freeze ETH holdout result
        id: freeze
        shell: bash
        run: |
          holdout_a_pass=$(python -c 'import json; print(str(json.load(open("alpha-v4-holdout-a.json"))["holdout_a_gate_pass"]).lower())')
          echo "holdout_a_pass=${holdout_a_pass}" >> "$GITHUB_OUTPUT"
          echo "holdout_a_b64=$(base64 -w0 alpha-v4-holdout-a.json)" >> "$GITHUB_OUTPUT"
      - name: Show ETH holdout result
        run: cat alpha-v4-holdout-a.json

  bnb-holdout-b:
    needs: [dev-search, eth-holdout-a]
    if: needs.eth-holdout-a.outputs.holdout_a_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Restore exact frozen candidate and ETH gate evidence
        shell: bash
        env:
          CANDIDATE_B64: ${{ needs.dev-search.outputs.candidate_b64 }}
          HOLDOUT_A_B64: ${{ needs.eth-holdout-a.outputs.holdout_a_b64 }}
        run: |
          echo "$CANDIDATE_B64" | base64 -d > alpha-v4-candidate.json
          echo "$HOLDOUT_A_B64" | base64 -d > alpha-v4-holdout-a.json
      - name: Evaluate fresh recent BNB holdout once
        run: |
          python -m romeo_crt_engine.alpha_lab.run_cycle_v4 holdout-b \
            --cache-dir .alpha-cache-v4 \
            --candidate alpha-v4-candidate.json \
            --holdout-a-result alpha-v4-holdout-a.json \
            --result-out alpha-v4-holdout-b.json
      - name: Show BNB holdout result
        run: cat alpha-v4-holdout-b.json
