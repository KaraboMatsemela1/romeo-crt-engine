name: OANDA EUR_USD 2020-2022 Raw Qualification

on:
  push:
    branches:
      - agent/phase-6b-candidate-revision
    paths:
      - .github/qualification/oanda-history-eurusd-2020-2022.request

jobs:
  collect-eurusd-year:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        year: [2020, 2021, 2022]
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Require runtime-only OANDA practice credentials
        run: |
          test -n "$OANDA_ACCOUNT_ID"
          test -n "$OANDA_API_TOKEN"

      - name: Collect frozen EUR_USD yearly MID M1 shard
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python scripts/collect_oanda_history_shard.py \
            --instrument EUR_USD \
            --year "$YEAR" \
            --output-dir /tmp/oanda_raw

      - name: Verify manifest is credential-free and outcome-locked
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - "$YEAR" "/tmp/oanda_raw/EUR_USD_${YEAR}_MID_M1.manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          year = int(sys.argv[1])
          path = Path(sys.argv[2])
          manifest = json.loads(path.read_text())
          serialized = json.dumps(manifest, sort_keys=True).lower()

          assert manifest['schema_version'] == 'P6B_OANDA_HISTORY_SHARD_V1'
          assert manifest['environment'] == 'practice'
          assert manifest['account_scope'] == 'REDACTED_RUNTIME_ACCOUNT'
          assert manifest['instrument'] == 'EUR_USD'
          assert manifest['year'] == year
          assert manifest['price_component'] == 'MID'
          assert manifest['granularity'] == 'M1'
          assert manifest['refetch']['status'] == 'EXACT_PROVIDER_VALUE_MATCH'
          assert manifest['gap_reconciliation_status'] == 'UNRECONCILED'
          for flag in (
              'trusted_dataset_authorized',
              'detector_execution_authorized',
              'tradeplan_count_access_authorized',
              'backtester_authorized',
              'pnl_outcome_access_authorized',
              'paper_trading_authorized',
              'shadow_trading_authorized',
              'live_trading_authorized',
          ):
              assert manifest[flag] is False
          for forbidden in ('account_id', 'api_token', 'authorization', 'bearer ', 'balance', 'nav'):
              assert forbidden not in serialized

          print('OANDA_HISTORY_SHARD_ARTIFACT_SAFE=true')
          print(f"year={year}")
          print(f"page_count={manifest['page_count']}")
          print(f"complete_candle_count={manifest['complete_candle_count']}")
          print(f"missing_interval_count={manifest['missing_interval_count']}")
          print(f"missing_minutes={manifest['missing_minutes']}")
          print(f"normalized_provider_values_sha256={manifest['normalized_provider_values_sha256']}")
          print(f"retrieval_sha256={manifest['retrieval_sha256']}")
          print(f"missing_intervals_sha256={manifest['missing_intervals_sha256']}")
          print(f"refetch_provider_value_sha256={manifest['refetch']['provider_value_sha256']}")
          PY

      - name: Upload credential-free manifest only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p6b-eurusd-${{ matrix.year }}-manifest
          path: /tmp/oanda_raw/EUR_USD_${{ matrix.year }}_MID_M1.manifest.json
          if-no-files-found: error
          retention-days: 7
