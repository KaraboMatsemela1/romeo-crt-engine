name: OANDA Practice Read-Only Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-practice-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Verify practice read-only connectivity
        env:
          OANDA_ENV: practice
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: >-
          python scripts/run_oanda_practice_readonly_smoke.py
          --output /tmp/oanda-practice-readonly-smoke.json
      - name: Upload non-secret smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oanda-practice-readonly-smoke-report
          path: /tmp/oanda-practice-readonly-smoke.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
