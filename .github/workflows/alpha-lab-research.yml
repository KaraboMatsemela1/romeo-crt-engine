name: Alpha Lab Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/romeo_crt_engine/alpha_lab/models.py"
      - "src/romeo_crt_engine/alpha_lab/data.py"
      - "src/romeo_crt_engine/alpha_lab/strategy.py"
      - "src/romeo_crt_engine/alpha_lab/backtest.py"
      - "src/romeo_crt_engine/alpha_lab/optimize.py"
      - "src/romeo_crt_engine/alpha_lab/run_cycle.py"
      - "tests/alpha_lab/test_backtest.py"
      - "tests/alpha_lab/test_data.py"
      - "tests/alpha_lab/test_strategy.py"
      - "tests/alpha_lab/test_windows.py"
      - "tests/alpha_lab/test_optimize.py"
      - "docs/ALPHA_LAB.md"
      - ".github/workflows/alpha-lab-research.yml"

jobs:
  dev-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate_pass: ${{ steps.freeze.outputs.candidate_pass }}
      candidate_b64: ${{ steps.freeze.outputs.candidate_b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Search DEV only
        run: |
          python -m romeo_crt_engine.alpha_lab.run_cycle dev-search \
            --cache-dir .alpha-cache \
            --candidate-out alpha-dev-candidate.json \
            --metrics-out alpha-dev-metrics.json
      - name: Freeze DEV candidate output
        id: freeze
        shell: bash
        run: |
          candidate_pass=$(python -c 'import json; print(str(json.load(open("alpha-dev-candidate.json"))["dev_gate_pass"]).lower())')
          echo "candidate_pass=${candidate_pass}" >> "$GITHUB_OUTPUT"
          echo "candidate_b64=$(base64 -w0 alpha-dev-candidate.json)" >> "$GITHUB_OUTPUT"
      - name: Show frozen candidate
        run: cat alpha-dev-candidate.json

  oos-gate:
    needs: dev-search
    if: needs.dev-search.outputs.candidate_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Restore exact frozen DEV candidate
        shell: bash
        env:
          CANDIDATE_B64: ${{ needs.dev-search.outputs.candidate_b64 }}
        run: echo "$CANDIDATE_B64" | base64 -d > alpha-dev-candidate.json
      - name: Evaluate OOS once
        run: |
          python -m romeo_crt_engine.alpha_lab.run_cycle oos-eval \
            --cache-dir .alpha-cache \
            --candidate alpha-dev-candidate.json \
            --result-out alpha-oos-result.json
      - name: Show OOS result
        run: cat alpha-oos-result.json
