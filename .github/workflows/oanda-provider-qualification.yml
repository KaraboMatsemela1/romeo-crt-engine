name: OANDA Provider Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-6b-candidate-revision
    paths:
      - .github/workflows/oanda-provider-qualification.yml

jobs:
  qualify-practice-account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Require OANDA practice credentials
        run: |
          test -n "$OANDA_ACCOUNT_ID"
          test -n "$OANDA_API_TOKEN"
      - name: Qualify practice account
        run: python scripts/qualify_oanda_v20.py --environment practice --output /tmp/oanda-instrument-discovery.json

  nas100-usd-reconciliation-evidence:
    needs: qualify-practice-account
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2019, 2020, 2021, 2022]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Fetch read-only NAS100_USD M1 history and build V2 evidence
        run: python scripts/collect_oanda_history_shard.py --instrument NAS100_USD --year ${{ matrix.year }} --output-dir /tmp/history
      - name: Validate V2 reconciliation evidence
        run: |
          python - "/tmp/history/NAS100_USD_${{ matrix.year }}_MID_M1.reconciliation-v2.json" "${{ matrix.year }}" <<'PY'
          import json,sys
          from pathlib import Path
          e=json.loads(Path(sys.argv[1]).read_text())
          year=int(sys.argv[2])
          assert e['schema_version']=='P6B_OANDA_RECONCILIATION_EVIDENCE_V2'
          assert e['observation_policy_version']=='P6B_OANDA_OBSERVATION_POLICY_V2'
          assert e['instrument']=='NAS100_USD' and e['year']==year
          assert e['refetch']['status']=='EXACT_PROVIDER_VALUE_MATCH'
          assert e['reconciliation_status']=='PENDING_CLASSIFICATION'
          assert e['classification_contract']['fail_closed_state']=='UNRESOLVED_PROVIDER_GAP'
          assert e['detector_execution_authorized'] is False
          assert e['pnl_outcome_access_authorized'] is False
          serialized=json.dumps(e,sort_keys=True).lower()
          for marker in ('authorization','bearer ','oanda_api_token','oanda_account_id','"balance"','"nav"','.jsonl.gz'):
              assert marker not in serialized
          print('reconciliation_evidence_validation=PASS')
          print('year='+str(year))
          print('missing_intervals='+str(e['missing_interval_count']))
          print('missing_minutes='+str(e['missing_minutes']))
          PY
      - name: Upload reconciliation evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6b-reconciliation-NAS100_USD-${{ matrix.year }}
          path: /tmp/history/NAS100_USD_${{ matrix.year }}_MID_M1.reconciliation-v2.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Delete fetched history and local evidence copy
        if: always()
        run: rm -rf /tmp/history
