name: OANDA Provider Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-6b-candidate-revision
    paths:
      - .github/workflows/oanda-provider-qualification.yml

jobs:
  qualify-practice-account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Require OANDA practice credentials
        run: |
          test -n "$OANDA_ACCOUNT_ID"
          test -n "$OANDA_API_TOKEN"
      - name: Qualify practice account
        run: python scripts/qualify_oanda_v20.py --environment practice --output /tmp/oanda-instrument-discovery.json

  all-gap-s5-reconciliation:
    needs: qualify-practice-account
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - instrument: EUR_USD
            year: 2019
          - instrument: EUR_USD
            year: 2020
          - instrument: EUR_USD
            year: 2021
          - instrument: EUR_USD
            year: 2022
          - instrument: XAU_USD
            year: 2019
          - instrument: XAU_USD
            year: 2020
          - instrument: XAU_USD
            year: 2021
          - instrument: XAU_USD
            year: 2022
          - instrument: NAS100_USD
            year: 2019
          - instrument: NAS100_USD
            year: 2020
          - instrument: NAS100_USD
            year: 2021
          - instrument: NAS100_USD
            year: 2022
          - instrument: SPX500_USD
            year: 2019
          - instrument: SPX500_USD
            year: 2020
          - instrument: SPX500_USD
            year: 2021
          - instrument: SPX500_USD
            year: 2022
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      P6B_INSTRUMENT: ${{ matrix.instrument }}
      P6B_YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Fetch frozen shard and probe every M1 gap at S5
        run: |
          python scripts/probe_oanda_all_gaps_s5.py \
            --instrument "$P6B_INSTRUMENT" \
            --year "$P6B_YEAR" \
            --output-dir /tmp/history
      - name: Validate complete all-gap reconciliation evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          instrument = os.environ['P6B_INSTRUMENT']
          year = int(os.environ['P6B_YEAR'])
          prefix = Path('/tmp/history') / f'{instrument}_{year}_MID_M1'
          base = json.loads(Path(str(prefix) + '.reconciliation-v2.json').read_text())
          s5 = json.loads(Path(str(prefix) + '.s5-gap-evidence-v1.json').read_text())

          assert base['schema_version'] == 'P6B_OANDA_RECONCILIATION_EVIDENCE_V2'
          assert base['observation_policy_version'] == 'P6B_OANDA_OBSERVATION_POLICY_V2'
          assert base['provider'] == 'OANDA_V20'
          assert base['environment'] == 'practice'
          assert base['instrument'] == instrument and base['year'] == year
          assert base['price_component'] == 'MID' and base['granularity'] == 'M1'
          assert base['refetch']['status'] == 'EXACT_PROVIDER_VALUE_MATCH'
          assert s5['schema_version'] == 'P6B_OANDA_S5_GAP_EVIDENCE_V1'
          assert s5['observation_policy_version'] == 'P6B_OANDA_OBSERVATION_POLICY_V2'
          assert s5['provider'] == 'OANDA_V20'
          assert s5['environment'] == 'practice'
          assert s5['instrument'] == instrument and s5['year'] == year
          assert s5['source_missing_intervals_sha256'] == base['missing_intervals_sha256']
          assert s5['eligible_gap_count'] == base['missing_interval_count']
          assert len(s5['classifications']) == base['missing_interval_count']
          assert (
              s5['eligible_gap_count']
              == s5['no_price_observation_gap_count']
              + s5['unresolved_provider_gap_count']
          )
          assert (
              base['missing_minutes']
              == s5['no_price_observation_minutes']
              + s5['unresolved_provider_gap_minutes']
          )
          assert base['detector_execution_authorized'] is False
          assert base['pnl_outcome_access_authorized'] is False
          assert s5['detector_execution_authorized'] is False
          assert s5['pnl_outcome_access_authorized'] is False

          serialized = (json.dumps(base, sort_keys=True) + json.dumps(s5, sort_keys=True)).lower()
          for marker in (
              'authorization',
              'bearer ',
              'oanda_api_token',
              'oanda_account_id',
              '"balance"',
              '"nav"',
              '.jsonl.gz',
          ):
              assert marker not in serialized

          print('s5_all_gap_validation=PASS')
          print(f'history_shard={instrument}/{year}')
          print('raw_missing_gaps=' + str(base['missing_interval_count']))
          print('raw_missing_minutes=' + str(base['missing_minutes']))
          print('s5_classified_gaps=' + str(s5['eligible_gap_count']))
          print('s5_no_price_gaps=' + str(s5['no_price_observation_gap_count']))
          print('s5_no_price_minutes=' + str(s5['no_price_observation_minutes']))
          print('s5_unresolved_gaps=' + str(s5['unresolved_provider_gap_count']))
          print('s5_unresolved_minutes=' + str(s5['unresolved_provider_gap_minutes']))
          print('detector_execution_authorized=false')
          print('pnl_outcome_access_authorized=false')
          PY
      - name: Upload all-gap reconciliation evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6b-s5-all-gap-${{ matrix.instrument }}-${{ matrix.year }}
          path: |
            /tmp/history/${{ matrix.instrument }}_${{ matrix.year }}_MID_M1.reconciliation-v2.json
            /tmp/history/${{ matrix.instrument }}_${{ matrix.year }}_MID_M1.s5-gap-evidence-v1.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Delete fetched history and local evidence copy
        if: always()
        run: rm -rf /tmp/history
