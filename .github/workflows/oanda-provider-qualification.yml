name: OANDA Provider Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-6b-candidate-revision
    paths:
      - .github/workflows/oanda-provider-qualification.yml

jobs:
  qualify-practice-account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Require OANDA practice credentials
        run: |
          test -n "$OANDA_ACCOUNT_ID"
          test -n "$OANDA_API_TOKEN"
      - name: Qualify practice account
        run: python scripts/qualify_oanda_v20.py --environment practice --output /tmp/oanda-instrument-discovery.json

  xau-usd-2022-s5-reconciliation-pilot:
    needs: qualify-practice-account
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Fetch XAU_USD 2022 and probe short gaps at S5
        run: python scripts/collect_oanda_history_shard.py --instrument XAU_USD --year 2022 --output-dir /tmp/history --probe-s5-short-gaps
      - name: Validate redacted V2 reconciliation evidence
        run: |
          python - /tmp/history/XAU_USD_2022_MID_M1.reconciliation-v2.json <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('/tmp/history/XAU_USD_2022_MID_M1.reconciliation-v2.json').read_text())
          assert e['schema_version']=='P6B_OANDA_RECONCILIATION_EVIDENCE_V2'
          assert e['instrument']=='XAU_USD' and e['year']==2022
          assert e['refetch']['status']=='EXACT_PROVIDER_VALUE_MATCH'
          assert e['detector_execution_authorized'] is False
          assert e['pnl_outcome_access_authorized'] is False
          serialized=json.dumps(e,sort_keys=True).lower()
          for marker in ('authorization','bearer ','oanda_api_token','oanda_account_id','"balance"','"nav"','.jsonl.gz'):
              assert marker not in serialized
          print('s5_reconciliation_pilot_validation=PASS')
          print('reconciliation_status='+str(e['reconciliation_status']))
          print('missing_intervals='+str(e['missing_interval_count']))
          print('missing_minutes='+str(e['missing_minutes']))
          print('detector_execution_authorized=false')
          print('pnl_outcome_access_authorized=false')
          PY
      - name: Upload reconciliation evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6b-reconciliation-XAU_USD-2022-s5-pilot
          path: /tmp/history/XAU_USD_2022_MID_M1.reconciliation-v2.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Delete fetched history and local evidence copy
        if: always()
        run: rm -rf /tmp/history
