name: OANDA Provider Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-6b-candidate-revision
    paths:
      - .github/workflows/oanda-provider-qualification.yml

jobs:
  qualify-practice-account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Require OANDA practice credentials
        run: |
          test -n "$OANDA_ACCOUNT_ID"
          test -n "$OANDA_API_TOKEN"
      - name: Qualify practice account
        run: python scripts/qualify_oanda_v20.py --environment practice --output /tmp/oanda-instrument-discovery.json

  spx500-2021-history-validation:
    needs: qualify-practice-account
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OANDA_ENV: practice
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Fetch read-only SPX500_USD 2021 M1 history
        run: python scripts/collect_oanda_history_shard.py --instrument SPX500_USD --year 2021 --output-dir /tmp/history
      - name: Validate history manifest
        run: |
          python - /tmp/history/SPX500_USD_2021_MID_M1.manifest.json <<'PY'
          import json,sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text())
          assert m['environment']=='practice'
          assert m['account_scope']=='REDACTED_RUNTIME_ACCOUNT'
          assert m['instrument']=='SPX500_USD'
          assert m['year']==2021
          assert m['price_component']=='MID'
          assert m['granularity']=='M1'
          assert m['refetch']['status']=='EXACT_PROVIDER_VALUE_MATCH'
          assert m['detector_execution_authorized'] is False
          assert m['pnl_outcome_access_authorized'] is False
          assert m['paper_trading_authorized'] is False
          assert m['live_trading_authorized'] is False
          print('history_validation=PASS')
          print('complete_candles='+str(m['complete_candle_count']))
          print('pages='+str(m['page_count']))
          print('missing_intervals='+str(m['missing_interval_count']))
          print('missing_minutes='+str(m['missing_minutes']))
          PY
      - name: Delete fetched history
        if: always()
        run: rm -rf /tmp/history
