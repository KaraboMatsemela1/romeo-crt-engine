name: Backtest Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-smoke.yml"
      - "src/romeo_crt_engine/backtest/**"
      - "src/romeo_crt_engine/crt/**"
      - "src/romeo_crt_engine/market_data/**"
      - "scripts/ingest_binance_spot.py"
      - "scripts/run_backtest.py"
      - "experiments/phase5/P5_SIMULATION_WINDOW_001.md"
      - "requirements.lock"

jobs:
  september-2025-btcusdt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Build preregistered September 2025 trusted dataset
        run: |
          python scripts/ingest_binance_spot.py \
            --symbol BTCUSDT \
            --start-utc-day 2025-09-01 \
            --end-utc-day 2025-09-30 \
            --data-root /tmp/romeo-phase5-data
      - name: Assert trusted dataset shape and print manifest
        run: |
          manifest=$(find /tmp/romeo-phase5-data/normalized -name manifest.json -type f -print -quit)
          test -n "$manifest"
          cat "$manifest"
          python - "$manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload['quality_status'] == 'TRUSTED'
          assert payload['symbol'] == 'BTCUSDT'
          assert payload['m1_rows'] == 43200
          assert payload['h1_rows'] == 720
          assert payload['d1_rows'] == 29
          PY
      - name: Run detector and all preregistered cost scenarios
        run: |
          dataset_dir=$(find /tmp/romeo-phase5-data/normalized -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$dataset_dir"
          for scenario in ideal base stressed severe; do
            python scripts/run_backtest.py \
              --dataset-dir "$dataset_dir" \
              --cost-scenario "$scenario" \
              --initial-equity 100000 \
              --risk-fraction 0.005 \
              --max-concurrent-positions 1 \
              > "/tmp/backtest-${scenario}.json"
            cat "/tmp/backtest-${scenario}.json"
          done
      - name: Assert detector enumeration is outcome-independent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          outputs = [json.loads(Path(f'/tmp/backtest-{name}.json').read_text()) for name in ('ideal', 'base', 'stressed', 'severe')]
          for result in outputs:
              assert result['detector_status'] == 'COMPLETE'
              assert result['detector_candidate_count'] == 27
          candidate_counts = {result['detector_candidate_count'] for result in outputs}
          plan_counts = {result['detector_trade_plan_count'] for result in outputs}
          detector_hashes = {result['detector_run_sha256'] for result in outputs}
          assert candidate_counts == {27}
          assert len(plan_counts) == 1
          assert len(detector_hashes) == 1
          PY
