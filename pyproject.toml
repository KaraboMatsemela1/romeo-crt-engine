[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "romeo-crt-engine"
version = "0.1.0"
description = "Evidence-driven CRT strategy research, validation and execution engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]
research = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=17",
  "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
