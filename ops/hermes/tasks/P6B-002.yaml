id: P6B-002
sequence: 2
status: READY
executor: HERMES_LOCAL
branch: agent/phase-6b-candidate-revision
depends_on:
  - P6B-001
objective: After P6B-001 PASS, collect the remaining 15 frozen OANDA practice MID/M1 yearly shards and stop before any detector or performance access.
allowed_commands:
  - git fetch origin
  - git checkout agent/phase-6b-candidate-revision
  - git pull --ff-only
  - |
    for instrument in EUR_USD XAU_USD NAS100_USD SPX500_USD; do
      for year in 2019 2020 2021 2022; do
        if [ "$instrument" = "EUR_USD" ] && [ "$year" = "2019" ]; then
          continue
        fi
        python scripts/collect_oanda_history_shard.py --instrument "$instrument" --year "$year" || exit 1
      done
    done
required_environment:
  - OANDA_ENV=practice
  - OANDA_ACCOUNT_ID=LOCAL_SECRET
  - OANDA_API_TOKEN=LOCAL_SECRET
pass_conditions:
  - all 15 executions return zero
  - every shard prints manifest_self_check=PASS
  - every shard prints refetch=EXACT_PROVIDER_VALUE_MATCH
  - all 16 local manifests exist including P6B-001
  - detector_execution_authorized=false for every manifest
  - pnl_outcome_access_authorized=false for every manifest
forbidden_actions:
  - expose or persist OANDA credentials
  - upload raw OANDA M1 data
  - run detector
  - inspect TradePlan counts or reason distributions
  - run backtester or calculate PnL
  - access v0.1 OOS or CONFIRM
  - alter frozen symbols, years, price component, paging, strategy rules, thresholds, or data gates
result_channel: github_issue_14
result_prefix: '[HERMES_RESULT]'
result_fields:
  - task_id
  - status
  - completed_shards
  - total_shards
  - all_manifest_self_checks
  - all_refetch_checks
  - per_instrument_missing_interval_count
  - per_instrument_missing_minutes
  - credentials_redacted
  - detector_execution_authorized
  - pnl_outcome_access_authorized
stop_after_pass: true
